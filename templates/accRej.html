<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PharmaLook — Review applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream: #FBF7EE;
      --paper: #ffffff;
      --amber: #C98A2C;
      --amber-deep: #9C6A1E;
      --amber-pale: #F3E2C2;
      --green-deep: #1E3229;
      --green-mid: #3E5C4B;
      --line: rgba(30,50,41,0.12);
      --red: #B3432B;
      --red-soft: #F7E5E0;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; background: var(--cream); font-family:'Inter', sans-serif; color: var(--green-deep); }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding: 16px 32px; background: var(--paper); border-bottom: 1px solid var(--line);
    }
    .topbar .logo-mark img{ height: 40px; width:auto; }
    .topbar a{
      text-decoration:none; font-size: 14px; font-weight: 600; color: var(--green-deep);
      display:flex; align-items:center; gap:7px;
    }
    .topbar a:hover{ color: var(--amber-deep); }
    .topbar a svg{ width:16px; height:16px; }

    .wrap{ max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }

    .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom: 26px; flex-wrap:wrap; }
    .eyebrow{ font-size: 11px; letter-spacing:0.12em; text-transform:uppercase; color: var(--amber-deep); font-weight:700; margin-bottom: 6px; }
    .page-head h1{ font-family:'Fraunces', serif; font-weight:700; font-size: 30px; margin: 0 0 8px; }
    .page-head p{ margin:0; font-size:14px; color: var(--green-mid); }

    .hero-stat{
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 22px; display:flex; align-items:center; gap:14px; min-width: 220px;
    }
    .hero-stat-icon{ width:40px; height:40px; border-radius:10px; background: var(--amber-pale); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hero-stat-icon svg{ width:18px; height:18px; color: var(--amber-deep); }
    .hero-stat-label{ font-size:12.5px; color: var(--green-mid); }
    .hero-stat-num{ font-family:'Fraunces', serif; font-weight:700; font-size: 22px; line-height:1.2; }
    .hero-stat-sub{ font-size:11.5px; color: var(--green-mid); }

    .panel{ background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 30px; }

    .empty-box{
      border: 1.5px dashed var(--line); border-radius: 16px;
      padding: 60px 30px; text-align:center;
    }
    .empty-icon{
      width:64px; height:64px; border-radius:50%; margin: 0 auto 20px;
      background: var(--amber-pale); display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .empty-icon svg{ width:28px; height:28px; color: var(--amber-deep); }
    .empty-box h3{ font-family:'Fraunces', serif; font-size: 19px; margin: 0 0 8px; }
    .empty-box p{ font-size: 13.5px; color: var(--green-mid); margin:0; max-width:340px; margin:0 auto; line-height:1.5; }

    .request-card{
      background: var(--cream); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 20px; margin-bottom: 14px;
      display:flex; align-items:center; justify-content:space-between; gap: 16px; flex-wrap: wrap;
    }
    .request-card:last-child{ margin-bottom:0; }
    .request-info{ display:flex; align-items:center; gap:14px; }
    .request-icon{ width:44px; height:44px; border-radius:12px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .request-icon svg{ width:19px; height:19px; color: var(--green-mid); }
    .request-info .r-name{ font-weight:700; font-size:15px; margin:0 0 3px; }
    .request-info .r-meta{ font-size: 12.5px; color: var(--green-mid); margin:0; }
    .request-actions{ display:flex; gap:8px; }
    .btn-accept, .btn-reject{
      display:inline-flex; align-items:center; gap:6px;
      border:none; border-radius:9px; padding: 9px 16px; font-size:13px; font-weight:600; cursor:pointer;
    }
    .btn-accept{ background: var(--green-deep); color: var(--cream); }
    .btn-accept:hover{ background:#142219; }
    .btn-reject{ background: var(--red-soft); color: var(--red); }
    .btn-reject:hover{ background:#f0d0c8; }
    .btn-accept svg, .btn-reject svg{ width:13px; height:13px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo-mark">
      <img src="../static/images/pharmalook-logo.png" alt="PharmaLook">
    </div>
    <a href="admin-dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to dashboard
    </a>
  </div>

  <div class="wrap">
    <div class="page-head">
      <div>
        <div class="eyebrow">Admin review</div>
        <h1>New pharmacy applications</h1>
        <p>Review and manage newly submitted pharmacy applications.</p>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div>
          <div class="hero-stat-label">Pending Applications</div>
          <div class="hero-stat-num" id="pendingCount">–</div>
          <div class="hero-stat-sub" id="pendingSub">Loading...</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div id="viewer">
        <div class="empty-box"><p>Loading...</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, ADMIN_EMAIL } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      ref, query, orderByChild, equalTo, get, update, remove
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const viewer = document.getElementById("viewer");

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        window.location.href = "login.html";
        return;
      }
      await loadPending();
    });

    async function loadPending() {
      const q = query(ref(db, "pharmacists"), orderByChild("status"), equalTo("pending"));
      const snap = await get(q);

      const count = snap.exists() ? Object.keys(snap.val()).length : 0;
      document.getElementById("pendingCount").textContent = count;
      document.getElementById("pendingSub").textContent =
        count === 0 ? "No applications waiting for review" : "Waiting for your review";

      viewer.innerHTML = "";

      if (!snap.exists()) {
        viewer.innerHTML = `
          <div class="empty-box">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
            </div>
            <h3>No pending applications right now.</h3>
            <p>Once new applications are submitted, they will appear here for your review.</p>
          </div>`;
        return;
      }

      snap.forEach((child) => {
        const p = child.val();
        const div = document.createElement("div");
        div.className = "request-card";
        div.innerHTML = `
          <div class="request-info">
            <div class="request-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6"/></svg>
            </div>
            <div>
              <p class="r-name">${p.name}</p>
              <p class="r-meta">📍 ${p.location} · ${p.email}</p>
            </div>
          </div>
          <div class="request-actions">
            <button class="btn-accept" data-action="accept" data-id="${child.key}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Accept
            </button>
            <button class="btn-reject" data-action="reject" data-id="${child.key}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Reject
            </button>
          </div>
        `;
        viewer.appendChild(div);
      });

      viewer.querySelectorAll('[data-action="accept"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          await update(ref(db, "pharmacists/" + btn.dataset.id), { status: "approved" });
          loadPending();
        });
      });

      viewer.querySelectorAll('[data-action="reject"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          await remove(ref(db, "pharmacists/" + btn.dataset.id));
          loadPending();
        });
      });
    }
  </script>
</body>
</html>
