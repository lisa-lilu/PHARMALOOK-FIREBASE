<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PharmaLook — Search results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream: #FBF7EE; --paper: #ffffff; --amber: #C98A2C; --amber-deep: #9C6A1E; --amber-pale: #F3E2C2;
      --green-deep: #1E3229; --green-mid: #3E5C4B; --line: rgba(30,50,41,0.12); --red: #B3432B;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; background: var(--cream); font-family:'Inter', sans-serif; color: var(--green-deep); }

    .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 16px 32px; background: var(--paper); border-bottom: 1px solid var(--line); }
    .topbar .logo-mark img{ height: 38px; width:auto; }

    /* ---- Overall page layout: sidebar ALWAYS beside the content, on every screen size ---- */
    .page{
      display:grid;
      grid-template-columns: 240px 1fr;
      max-width: 1180px;
      margin: 0 auto;
      align-items:start;
    }
    /* On narrow screens, shrink the sidebar column instead of stacking it above/below */
    @media (max-width: 780px){
      .page{ grid-template-columns: 180px 1fr; }
    }
    @media (max-width: 560px){
      .page{ grid-template-columns: 150px 1fr; }
    }

    /* ---- Sidebar ---- */
    .sidebar{
      position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
      padding: 32px 22px 40px; border-right: 1px solid var(--line);
    }
    @media (max-width: 560px){
      .sidebar{ padding: 20px 12px 30px; }
    }

    .sidebar h3{ font-family:'Fraunces', serif; font-size:16px; margin: 0 0 4px; }
    .sidebar .sidebar-sub{ font-size:12px; color: var(--green-mid); margin: 0 0 22px; }

    .filter-group{ margin-bottom:22px; }
    .filter-group:last-of-type{ margin-bottom:0; }
    .filter-group label.group-label{ display:block; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color: var(--amber-deep); margin-bottom:9px; }
    .filter-group select{
      width:100%; padding: 9px 10px; border:1px solid var(--line); border-radius:9px; font-size:13px;
      font-family:'Inter', sans-serif; background: var(--paper); color: var(--green-deep); outline:none; cursor:pointer;
    }
    .filter-group select:focus{ border-color: var(--amber); }
    .filter-radio-row{ display:flex; flex-direction:column; gap:7px; }
    .filter-radio-row label{ display:flex; align-items:center; gap:8px; font-size:13px; color: var(--green-mid); cursor:pointer; }
    .filter-radio-row input{ accent-color: var(--green-deep); cursor:pointer; }
    .filter-radio-row label.disabled{ opacity:0.45; cursor:default; }

    .clear-filters{
      width:100%; margin-top:24px; background:none; border:1px solid var(--line); color: var(--green-mid);
      font-size:12px; font-weight:600; padding: 9px; border-radius:8px; cursor:pointer;
    }
    .clear-filters:hover{ background: var(--paper); }

    .sidebar-location{
      margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line);
    }
    .sidebar-location p{ font-size:12px; color: var(--green-mid); margin: 0 0 10px; line-height:1.5; }
    .sidebar-location button{
      width:100%; border:none; background: var(--green-deep); color:#fff; padding: 9px 12px;
      border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
    }
    .sidebar-location.on p{ color:#2E7D4F; font-weight:600; }

    /* ---- Main content ---- */
    .main{ padding: 48px 32px 70px; min-width:0; }
    @media (max-width: 780px){ .main{ padding: 32px 20px 60px; } }
    @media (max-width: 560px){ .main{ padding: 24px 14px 50px; } }

    .search-head{ margin-bottom: 30px; }
    .kicker{ display:flex; align-items:center; gap:10px; font-size: 11px; letter-spacing:0.16em; text-transform:uppercase; color: var(--amber-deep); font-weight:700; margin-bottom: 10px; }
    .kicker::after{ content:""; flex:1; max-width:40px; height:1px; background: var(--line); }
    .search-head h1{ font-family:'Fraunces', serif; font-weight:600; font-size: 30px; margin: 0 0 22px; }

    .search-bar-wrap{ display:flex; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 6px; max-width: 560px; box-shadow: 0 14px 30px -18px rgba(30,50,41,0.2); }
    .search-bar-wrap input{ flex:1; border:none; outline:none; background:transparent; padding: 10px 14px; font-size: 14.5px; font-family:'Inter', sans-serif; color: var(--green-deep); min-width:0; }
    .search-bar-wrap button{ display:flex; align-items:center; gap:7px; border:none; background: var(--green-deep); color: var(--cream); padding: 10px 20px; border-radius: 8px; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap; }
    .search-bar-wrap button svg{ width:14px; height:14px; }

    .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .chip{
      border:1px solid var(--line); background:#fff; color: var(--green-mid); font-size:12.5px; font-weight:600;
      padding: 6px 14px; border-radius:999px; cursor:pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .chip:hover{ background: var(--green-deep); color: var(--cream); border-color: var(--green-deep); }

    .results-meta{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin: 30px 0 14px; flex-wrap:wrap; display:none; }
    .results-meta.visible{ display:flex; }
    .results-count{ font-size:13px; color: var(--green-mid); font-weight:600; }

    #results{ margin-top: 30px; }
    .empty-note{ text-align:center; padding: 40px 10px 4px; }
    .empty-icon{ width:64px; height:64px; border-radius:50%; margin: 0 auto 18px; background: var(--amber-pale); display:flex; align-items:center; justify-content:center; }
    .empty-icon svg{ width:26px; height:26px; color: var(--amber-deep); }
    .empty-note h3{ font-family:'Fraunces', serif; font-size: 17px; margin: 0 0 6px; }
    .empty-note p{ font-size: 13px; color: var(--green-mid); margin:0; }

    .medicine-card{ background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; text-align:left; position:relative; }
    .medicine-card .m-name{ font-family:'Fraunces', serif; font-size: 17px; margin-bottom: 6px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .m-badges{ display:flex; gap:6px; flex-wrap:wrap; }
    .m-distance{ font-size:11.5px; font-weight:700; background:#E3F3E7; color:#2E7D4F; padding:3px 10px; border-radius:999px; white-space:nowrap; }
    .m-category{ font-size:11.5px; font-weight:700; background: var(--amber-pale); color: var(--amber-deep); padding:3px 10px; border-radius:999px; white-space:nowrap; }
    .medicine-card .m-row{ font-size: 13px; color: var(--green-mid); margin: 3px 0; }
    .medicine-card .m-row strong{ color: var(--green-deep); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo-mark"><img src="../static/images/pharmalook-logo.png" alt="PharmaLook"></div>
  </div>

  <div class="page">

    <!-- SIDEBAR: always beside the content, on every screen size -->
    <aside class="sidebar">
      <h3>Filters</h3>
      <p class="sidebar-sub">Narrow down your search results.</p>

      <div class="filter-group">
        <label class="group-label">Medicine type</label>
        <select id="categoryFilter">
          <option value="">All types</option>
          <option value="pain relief">Pain relief</option>
          <option value="antibiotic">Antibiotics</option>
          <option value="vitamins">Vitamins & supplements</option>
          <option value="cold & flu">Cold & flu</option>
          <option value="digestive">Digestive health</option>
          <option value="skin care">Skin care</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="group-label">Sort by</label>
        <select id="sortFilter">
          <option value="relevance">Relevance</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="distance" id="sortDistanceOption" disabled>Distance: nearest first</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="group-label">Max distance</label>
        <div class="filter-radio-row" id="distanceRadioRow">
          <label class="disabled"><input type="radio" name="maxDist" value="0" checked disabled> Any distance</label>
          <label class="disabled"><input type="radio" name="maxDist" value="1" disabled> Within 1 km</label>
          <label class="disabled"><input type="radio" name="maxDist" value="3" disabled> Within 3 km</label>
          <label class="disabled"><input type="radio" name="maxDist" value="5" disabled> Within 5 km</label>
          <label class="disabled"><input type="radio" name="maxDist" value="10" disabled> Within 10 km</label>
        </div>
      </div>

      <button type="button" class="clear-filters" id="clearFiltersBtn">Clear all filters</button>

      <div class="sidebar-location" id="sidebarLocation">
        <p id="locationText">📍 Share your location to sort and filter by distance.</p>
        <button id="shareLocationBtn">Use my location</button>
      </div>
    </aside>

    <!-- MAIN: search bar + results, beside the sidebar -->
    <main class="main">
      <div class="search-head">
        <div class="kicker">PharmaLook</div>
        <h1>Find medicine nearby</h1>

        <form id="search-form" class="search-bar-wrap">
          <input type="text" id="search-bar" placeholder="e.g. Amoxicillin, Paracetamol..." autofocus />
          <button type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
            Search
          </button>
        </form>

        <div class="chip-row" id="chipRow">
          <button type="button" class="chip" data-q="Paracetamol">Paracetamol</button>
          <button type="button" class="chip" data-q="Amoxicillin">Amoxicillin</button>
          <button type="button" class="chip" data-q="Ibuprofen">Ibuprofen</button>
          <button type="button" class="chip" data-q="Vitamin C">Vitamin C</button>
          <button type="button" class="chip" data-q="Cough syrup">Cough syrup</button>
        </div>
      </div>

      <div class="results-meta" id="resultsMeta">
        <span class="results-count" id="resultsCount"></span>
      </div>
      <div id="results"></div>
    </main>

  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q") || "";
    document.getElementById("search-bar").value = initialQuery;

    let userLat = null;
    let userLng = null;
    let currentMatches = []; // full unfiltered result set for the active search

    // Haversine formula: distance in km between two lat/lng points
    function distanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Estimated travel time. Roads are longer than a straight line, so add 30%.
    // These are estimates (about 5 km/h walking, 25 km/h city driving), not live traffic data.
    function travelTimes(km) {
      const roadKm = km * 1.3;
      const fmt = (min) => {
        if (min < 1) return "1 min";
        if (min < 60) return `${Math.round(min)} min`;
        const h = Math.floor(min / 60);
        const m = Math.round(min % 60);
        return m ? `${h} h ${m} min` : `${h} h`;
      };
      return {
        walk: fmt((roadKm / 5) * 60),
        drive: fmt((roadKm / 25) * 60)
      };
    }

    document.getElementById("shareLocationBtn").addEventListener("click", () => {
      const wrap = document.getElementById("sidebarLocation");
      const text = document.getElementById("locationText");
      const btn = document.getElementById("shareLocationBtn");

      if (!navigator.geolocation) {
        text.textContent = "Your browser doesn't support location sharing.";
        return;
      }

      btn.textContent = "Locating...";
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          wrap.classList.add("on");
          text.textContent = "📍 Location shared — distance filters unlocked.";
          btn.style.display = "none";

          // Unlock distance-related filters now that we know location
          document.getElementById("sortDistanceOption").disabled = false;
          document.querySelectorAll('#distanceRadioRow input').forEach(r => r.disabled = false);
          document.querySelectorAll('#distanceRadioRow label').forEach(l => l.classList.remove("disabled"));

          applyMatchesToState(currentMatches);
        },
        () => {
          text.textContent = "Couldn't get your location. You can still search normally.";
          btn.textContent = "Try again";
        }
      );
    });

    // Very light keyword-based category guess, used only when a medicine record
    // has no explicit `category` field yet (older records / pharmacist hasn't tagged it).
    function guessCategory(med) {
      if (med.category) return med.category.toLowerCase();
      const text = ((med.Medicinename || "") + " " + (med.medicinedescription || "")).toLowerCase();
      if (/pain|fever|paracetamol|ibuprofen|aspirin/.test(text)) return "pain relief";
      if (/antibiotic|amoxicillin|cillin|mycin/.test(text)) return "antibiotic";
      if (/vitamin|supplement|mineral/.test(text)) return "vitamins";
      if (/cold|flu|cough|cold-flu|decongestant/.test(text)) return "cold & flu";
      if (/digest|antacid|laxative|stomach/.test(text)) return "digestive";
      if (/skin|cream|ointment|lotion/.test(text)) return "skin care";
      return "other";
    }

    const categoryLabels = {
      "pain relief": "Pain relief",
      "antibiotic": "Antibiotic",
      "vitamins": "Vitamins",
      "cold & flu": "Cold & flu",
      "digestive": "Digestive",
      "skin care": "Skin care",
      "other": "Other"
    };

    async function runSearch(queryText) {
      const resultsDiv = document.getElementById("results");
      const resultsMeta = document.getElementById("resultsMeta");
      resultsDiv.innerHTML = "";
      resultsMeta.classList.remove("visible");

      if (!queryText) {
        resultsDiv.innerHTML = `
          <div class="empty-note">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
            </div>
            <h3>Type a medicine name above</h3>
            <p>to see which nearby pharmacies have it in stock — or tap one of the suggestions.</p>
          </div>`;
        return;
      }

      const snap = await get(ref(db, "medicines"));
      const q = queryText.toLowerCase();
      let matches = [];
      if (snap.exists()) {
        snap.forEach((child) => {
          const m = child.val();
          if (m.Medicinename && m.Medicinename.toLowerCase().includes(q)) {
            m._category = guessCategory(m);
            matches.push(m);
          }
        });
      }

      currentMatches = matches;

      if (matches.length === 0) {
        resultsDiv.innerHTML = `
          <div class="empty-note">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
            </div>
            <h3>No results found</h3>
            <p>Nothing matching "${queryText}" yet. Try a different search.</p>
          </div>`;
        return;
      }

      resultsMeta.classList.add("visible");
      applyMatchesToState(matches);
    }

    // Applies distance calc (if location known) then re-renders with current filter/sort selections.
    function applyMatchesToState(matches) {
      if (userLat !== null && userLng !== null) {
        matches.forEach((m) => {
          m._distance = (m.lat && m.lng) ? distanceKm(userLat, userLng, m.lat, m.lng) : null;
        });
      }
      renderFiltered();
    }

    function renderFiltered() {
      const resultsDiv = document.getElementById("results");
      const resultsCount = document.getElementById("resultsCount");
      const category = document.getElementById("categoryFilter").value;
      const sortBy = document.getElementById("sortFilter").value;
      const maxDist = parseFloat(document.querySelector('input[name="maxDist"]:checked')?.value || "0");

      if (currentMatches.length === 0) return;

      let list = [...currentMatches];

      if (category) {
        list = list.filter(m => m._category === category);
      }
      if (maxDist > 0 && userLat !== null) {
        list = list.filter(m => m._distance !== null && m._distance !== undefined && m._distance <= maxDist);
      }

      if (sortBy === "price-asc") {
        list.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
      } else if (sortBy === "price-desc") {
        list.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0));
      } else if (sortBy === "distance" && userLat !== null) {
        list.sort((a, b) => {
          if (a._distance == null) return 1;
          if (b._distance == null) return -1;
          return a._distance - b._distance;
        });
      }

      resultsCount.textContent = `${list.length} result${list.length === 1 ? "" : "s"} found`;
      resultsDiv.innerHTML = "";

      if (list.length === 0) {
        resultsDiv.innerHTML = `
          <div class="empty-note">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
            </div>
            <h3>No matches with these filters</h3>
            <p>Try widening your distance or type filter.</p>
          </div>`;
        return;
      }

      list.forEach((med) => {
        const card = document.createElement("div");
        card.className = "medicine-card";
        const distanceBadge = med._distance != null
          ? `<span class="m-distance">${med._distance < 1 ? Math.round(med._distance * 1000) + " m" : med._distance.toFixed(1) + " km"} away</span>`
          : "";
        const categoryBadge = `<span class="m-category">${categoryLabels[med._category] || "Other"}</span>`;
        const t = med._distance != null ? travelTimes(med._distance) : null;
        card.innerHTML = `
          <div class="m-name">
            <span>${med.Medicinename}</span>
            <div class="m-badges">${categoryBadge}${distanceBadge}</div>
          </div>
          <div class="m-row"><strong>Dosage:</strong> ${med.Dosage}</div>
          <div class="m-row"><strong>Price:</strong> ${med.price} Birr</div>
          <div class="m-row"><strong>Description:</strong> ${med.medicinedescription}</div>
          <div class="m-row"><strong>Pharmacy:</strong> ${med.pharmacyName}</div>
          <div class="m-row"><strong>Location:</strong> ${med.location}</div>
          ${t ? `<div class="m-row"><strong>Travel time (approx.):</strong> ~${t.walk} walk · ~${t.drive} by car</div>` : ""}
        `;
        resultsDiv.appendChild(card);
      });
    }

    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      runSearch(document.getElementById("search-bar").value.trim());
    });

    document.getElementById("chipRow").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      const q = btn.dataset.q;
      document.getElementById("search-bar").value = q;
      runSearch(q);
    });

    document.getElementById("categoryFilter").addEventListener("change", renderFiltered);
    document.getElementById("sortFilter").addEventListener("change", renderFiltered);
    document.querySelectorAll('input[name="maxDist"]').forEach(r => r.addEventListener("change", renderFiltered));

    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
      document.getElementById("categoryFilter").value = "";
      document.getElementById("sortFilter").value = "relevance";
      document.querySelector('input[name="maxDist"][value="0"]').checked = true;
      renderFiltered();
    });

    runSearch(initialQuery);
  </script>
</body>
</html>
