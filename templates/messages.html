<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PharmaLook — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream: #FBF7EE; --paper: #ffffff; --amber: #C98A2C; --amber-deep: #9C6A1E;
      --amber-pale: #F3E2C2; --green-deep: #1E3229; --green-mid: #3E5C4B;
      --line: rgba(30,50,41,0.12); --red: #B3432B; --red-soft: #F7E5E0;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; background: var(--cream); font-family:'Inter', sans-serif; color: var(--green-deep); }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding: 16px 32px; background: var(--paper); border-bottom: 1px solid var(--line);
    }
    .topbar .logo-mark img{ height: 40px; width:auto; }
    .topbar a{
      text-decoration:none; font-size: 14px; font-weight: 600; color: var(--green-deep);
      display:flex; align-items:center; gap:7px;
    }
    .topbar a:hover{ color: var(--amber-deep); }
    .topbar a svg{ width:16px; height:16px; }

    .wrap{ max-width: 800px; margin: 0 auto; padding: 32px 24px 60px; }

    .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom: 26px; flex-wrap:wrap; }
    .eyebrow{ font-size: 11px; letter-spacing:0.12em; text-transform:uppercase; color: var(--amber-deep); font-weight:700; margin-bottom: 6px; }
    .page-head h1{ font-family:'Fraunces', serif; font-weight:700; font-size: 30px; margin: 0 0 8px; }
    .page-head p{ margin:0; font-size:14px; color: var(--green-mid); }

    .hero-stat{
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 22px; display:flex; align-items:center; gap:14px; min-width: 200px;
    }
    .hero-stat-icon{ width:40px; height:40px; border-radius:10px; background: var(--amber-pale); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hero-stat-icon svg{ width:18px; height:18px; color: var(--amber-deep); }
    .hero-stat-num{ font-family:'Fraunces', serif; font-weight:700; font-size: 22px; line-height:1.2; }
    .hero-stat-label{ font-size:12.5px; color: var(--green-mid); }

    .panel{ background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 12px; }

    .empty-box{ padding: 60px 30px; text-align:center; }
    .empty-icon{
      width:64px; height:64px; border-radius:50%; margin: 0 auto 20px;
      background: var(--amber-pale); display:flex; align-items:center; justify-content:center;
    }
    .empty-icon svg{ width:28px; height:28px; color: var(--amber-deep); }
    .empty-box h3{ font-family:'Fraunces', serif; font-size: 19px; margin: 0 0 8px; }
    .empty-box p{ font-size: 13.5px; color: var(--green-mid); margin:0; }

    .msg-card{ padding: 20px 18px; border-bottom: 1px solid var(--line); }
    .msg-card:last-child{ border-bottom:none; }
    .msg-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .msg-name{ font-weight:700; font-size:15px; }
    .msg-email{ font-size:12.5px; color: var(--amber-deep); text-decoration:none; }
    .msg-email:hover{ text-decoration:underline; }
    .msg-date{ font-size:12px; color: var(--green-mid); white-space:nowrap; }
    .msg-text{ font-size:14px; color: var(--green-mid); line-height:1.6; margin: 6px 0 10px; white-space:pre-wrap; }
    .msg-actions{ display:flex; gap:8px; }
    .btn-mini{
      display:inline-flex; align-items:center; gap:5px; border:none; border-radius:8px;
      padding: 6px 12px; font-size:12px; font-weight:600; cursor:pointer;
    }
    .btn-mini svg{ width:12px; height:12px; }
    .btn-reply{ background: var(--amber-pale); color: var(--amber-deep); text-decoration:none; }
    .btn-delete{ background: var(--red-soft); color: var(--red); }
    .btn-delete:hover{ background:#f0d0c8; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo-mark">
      <img src="../static/images/pharmalook-logo.png" alt="PharmaLook">
    </div>
    <a href="admin-dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to dashboard
    </a>
  </div>

  <div class="wrap">
    <div class="page-head">
      <div>
        <div class="eyebrow">Admin</div>
        <h1>Contact messages</h1>
        <p>Messages submitted through the homepage contact form.</p>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" fill="none" stroke="none"/><path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
        </div>
        <div>
          <div class="hero-stat-label">Total messages</div>
          <div class="hero-stat-num" id="msgCount">–</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div id="msgList">
        <div class="empty-box"><p>Loading...</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, ADMIN_EMAIL } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const list = document.getElementById("msgList");

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        window.location.href = "login.html";
        return;
      }
      await loadMessages();
    });

    function formatDate(ts){
      if (!ts) return "";
      return new Date(ts).toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
    }

    async function loadMessages() {
      const snap = await get(ref(db, "messages"));
      list.innerHTML = "";

      if (!snap.exists()) {
        document.getElementById("msgCount").textContent = "0";
        list.innerHTML = `
          <div class="empty-box">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            </div>
            <h3>No messages yet.</h3>
            <p>Submissions from the homepage contact form will show up here.</p>
          </div>`;
        return;
      }

      // Collect and sort newest first
      const items = [];
      snap.forEach((child) => items.push({ id: child.key, ...child.val() }));
      items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      document.getElementById("msgCount").textContent = items.length;

      items.forEach((m) => {
        const div = document.createElement("div");
        div.className = "msg-card";
        div.innerHTML = `
          <div class="msg-top">
            <div>
              <div class="msg-name">${m.name || "Unknown"}</div>
              <a class="msg-email" href="mailto:${m.email}">${m.email || ""}</a>
            </div>
            <div class="msg-date">${formatDate(m.createdAt)}</div>
          </div>
          <div class="msg-text">${m.message || ""}</div>
          <div class="msg-actions">
            <a class="btn-mini btn-reply" href="mailto:${m.email}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 5 5v2"/><path d="M8 5 3 10l5 5"/></svg>
              Reply by email
            </a>
            <button class="btn-mini btn-delete" data-id="${m.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              Delete
            </button>
          </div>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll(".btn-delete").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this message?")) return;
          await remove(ref(db, "messages/" + btn.dataset.id));
          loadMessages();
        });
      });
    }
  </script>
</body>
</html>
