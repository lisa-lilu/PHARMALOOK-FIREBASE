<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaLook - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream: #F6F3EA;
      --paper: #ffffff;
      --amber: #C98A2C;
      --amber-deep: #9C6A1E;
      --green-deep: #1E3229;
      --green-mid: #3E5C4B;
      --line: rgba(30,50,41,0.14);
      --red: #B3432B;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh;
      background: var(--cream);
      font-family:'Inter', sans-serif;
      color: var(--green-deep);
      display:flex; align-items:center; justify-content:center;
      padding: 32px;
    }
    .frame{
      width:100%; max-width: 1180px;
      display:grid; grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      align-items:stretch;
    }
    @media (max-width: 900px){
      .frame{ grid-template-columns: 1fr; }
      .visual{ display:none; }
    }

    .visual{
      position:relative;
      border-radius: 26px;
      overflow:hidden;
      min-height: 680px;
      box-shadow: 0 30px 60px -30px rgba(30,50,41,0.35);
    }
    .visual img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
    .visual::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(30,50,41,0.30) 0%, rgba(16,26,20,0.10) 32%, rgba(16,26,20,0.78) 100%);
    }
    .visual-logo{
      position:absolute; top: 32px; left: 32px; z-index:2;
      display:flex; align-items:center; gap:10px;
    }
    .visual-logo img{ height:30px; width:auto; filter: brightness(0) invert(1); }
    .visual-copy{
      position:absolute; left:0; right:0; bottom:0; z-index:2;
      padding: 38px 40px 42px;
    }
    .visual-copy .tag{
      display:inline-flex; align-items:center; gap:8px;
      font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase;
      color:#F3E2C2; font-weight:600; margin-bottom:14px;
    }
    .visual-copy h2{
      font-family:'Fraunces', serif; font-weight:600; font-size: 29px;
      line-height:1.22; margin: 0 0 12px; color:#fff;
    }
    .visual-copy p{
      font-size: 14.5px; line-height:1.6; color: rgba(251,247,238,0.85); max-width: 380px; margin:0;
    }

    .form-side{ display:flex; align-items:center; justify-content:center; }
    .card{
      width:100%; max-width: 420px;
      background: var(--paper);
      border-radius: 24px;
      padding: 40px 38px;
      box-shadow: 0 24px 60px -28px rgba(30,50,41,0.28);
      border: 1px solid rgba(30,50,41,0.06);
    }
    .card h1{ font-family:'Fraunces', serif; font-weight:600; font-size: 26px; margin: 0 0 8px; }
    .card .sub{ font-size:14px; color: var(--green-mid); margin: 0 0 26px; }

    .name-fields{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px){ .name-fields{ grid-template-columns: 1fr; } }

    .field{ margin-bottom: 16px; }
    .field label{ display:block; font-size: 12.5px; font-weight: 600; color: var(--green-mid); margin-bottom: 7px; }
    .input-wrap{ position:relative; display:flex; align-items:center; }
    .input-wrap svg.leading{ position:absolute; left: 14px; width:17px; height:17px; color: var(--green-mid); opacity:0.6; pointer-events:none; }
    .input-wrap input{
      width:100%; padding: 12px 14px 12px 42px;
      border: 1px solid var(--line); border-radius: 12px;
      font-size: 14px; font-family:'Inter', sans-serif;
      background: #FBFAF6; color: var(--green-deep); outline:none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .field.no-icon input{ padding-left: 14px; }
    .input-wrap input:focus{ border-color: var(--amber); background: #fff; box-shadow: 0 0 0 3px rgba(201,138,44,0.14); }
    .toggle-pass{
      position:absolute; right: 12px; background:none; border:none; cursor:pointer;
      color: var(--green-mid); opacity:0.65; display:flex; align-items:center; padding:2px;
    }
    .toggle-pass:hover{ opacity:1; }
    .toggle-pass svg{ width:16px; height:16px; }

    .form-message{ font-size: 13px; color: var(--red); min-height: 16px; margin-bottom: 10px; }

    .btn-signup{
      width:100%; margin-top: 6px; padding: 13px 18px;
      border:none; border-radius: 12px;
      background: var(--green-deep); color: var(--cream);
      font-size: 15px; font-weight: 600; cursor:pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-signup:hover{ background:#142219; box-shadow: 0 12px 26px -14px rgba(30,50,41,0.55); }

    .bottom-link{ text-align:center; margin-top: 22px; font-size: 13.5px; color: var(--green-mid); }
    .bottom-link a{ color: var(--green-deep); font-weight:700; text-decoration:none; border-bottom: 1.5px solid var(--amber); }
  </style>
</head>
<body>

  <div class="frame">
    <div class="visual">
      <img src="../static/images/pharmacist-handoff.png" alt="Pharmacist handing medicine to a patient">
      <div class="visual-logo">
        <img src="../static/images/pharmalook-logo.png" alt="PharmaLook">
      </div>
      <div class="visual-copy">
        <span class="tag">● Join as a patient</span>
        <h2>Find what you need, at the pharmacy nearest you.</h2>
        <p>Search once, see every nearby pharmacy that has it in stock, with real prices and dosages.</p>
      </div>
    </div>

    <div class="form-side">
      <div class="card">
        <h1>Create your account</h1>
        <p class="sub">Find the medicine you need at pharmacies near you.</p>

        <div id="formMessage" class="form-message"></div>

        <form id="signupForm">
          <div class="name-fields">
            <div class="field no-icon">
              <label for="firstName">First name</label>
              <div class="input-wrap"><input type="text" id="firstName" placeholder="Jane" required /></div>
            </div>
            <div class="field no-icon">
              <label for="lastName">Last name</label>
              <div class="input-wrap"><input type="text" id="lastName" placeholder="Doe" required /></div>
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
              <input type="email" id="email" placeholder="Enter your email" required />
            </div>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <div class="input-wrap">
              <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input type="tel" id="phone" placeholder="Enter your phone number" required />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" placeholder="Create a password" required />
              <button type="button" class="toggle-pass" data-target="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
              <button type="button" class="toggle-pass" data-target="confirmPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-signup">Sign up</button>
        </form>

        <p class="bottom-link">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    document.querySelectorAll(".toggle-pass").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === "password" ? "text" : "password";
      });
    });

    const form = document.getElementById("signupForm");
    const msg = document.getElementById("formMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        msg.textContent = "Passwords do not match.";
        return;
      }

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await set(ref(db, "users/" + cred.user.uid), {
          firstName, lastName, phone, email
        });
        window.location.href = "look.html";
      } catch (err) {
        if (err.code === "auth/email-already-in-use") {
          msg.textContent = "Email already registered. Please log in.";
        } else if (err.code === "auth/weak-password") {
          msg.textContent = "Password should be at least 6 characters.";
        } else {
          msg.textContent = err.message;
        }
      }
    });
  </script>
</body>
</html>
